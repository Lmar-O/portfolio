<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lmar — C: Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f1ea; --fg:#1c1b19; --mute:#7a766d; --card:#fff; --accent:#2f5d50; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161513; --fg:#eeeae0; --mute:#8c887e; --card:#1f1e1b; --accent:#7fc0ab; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.55 Inter, system-ui, sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:80px 24px 64px; }
  h1 { font:400 clamp(36px,5.5vw,64px)/1.08 Fraunces, Georgia, serif; letter-spacing:-.01em; max-width:16ch; }
  h1 i { color:var(--accent); }
  .intro { margin-top:20px; color:var(--mute); font-size:18px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:48px; margin-top:72px; }
  h2 { font:500 13px Inter; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); margin-bottom:16px; }
  .proj { display:block; background:var(--card); padding:20px; border-radius:14px; margin-bottom:12px; color:inherit; text-decoration:none; transition:transform .15s; }
  .proj:hover { transform:translateY(-2px); }
  .proj b { font:600 20px Fraunces, serif; display:block; }
  .proj span { color:var(--mute); font-size:14px; }
  .photos { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .photos div { border-radius:10px; aspect-ratio:4/5; }
  .photos div:first-child { grid-column:span 2; aspect-ratio:16/10; }
  .q1{background:linear-gradient(150deg,#d1b08a,#5b4330)} .q2{background:linear-gradient(200deg,#8aa6b4,#2b3a44)} .q3{background:linear-gradient(170deg,#9bab8e,#36422f)}
  footer { margin-top:72px; display:flex; gap:24px; font-size:14px; }
  footer a { color:var(--mute); } footer a:hover { color:var(--accent); }
  @media (max-width:760px){ .cols{grid-template-columns:1fr;gap:40px} .wrap{padding:56px 16px 48px} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Hi! I'm Lmar, a software engineer and <i>photographer.</i></h1>
  <p class="intro">This is where I'll put cool things I've built or made.</p>

  <div class="cols">
    <section>
      <h2>Built</h2>
      <a class="proj" href="#"><b>Project one</b><span>iOS app · 2026</span></a>
      <a class="proj" href="#"><b>Project two</b><span>Web · 2025</span></a>
      <a class="proj" href="#"><b>Project three</b><span>Tool · 2025</span></a>
    </section>
    <section>
      <h2>Shot</h2>
      <div class="photos"><div class="q1"></div><div class="q2"></div><div class="q3"></div></div>
    </section>
  </div>

  <footer><a href="#">GitHub</a><a href="#">Instagram</a><a href="#">Email</a></footer>
</div>
</body>
</html>
