<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lmar — A: Plain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fbfaf7; --fg:#1a1a1a; --mute:#8a8780; --line:#e6e3dc; --accent:#d9480f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111110; --fg:#ecebe6; --mute:#77756f; --line:#262624; --accent:#ff8a4c; } }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.7 "JetBrains Mono", ui-monospace, monospace; }
  main { max-width:620px; margin:0 auto; padding:96px 20px 64px; }
  h1 { font-size:15px; font-weight:600; }
  .hi { margin:32px 0 56px; }
  .hi p + p { margin-top:12px; }
  .wave { display:inline-block; }
  a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); }
  a:hover { color:var(--accent); border-color:var(--accent); }
  h2 { font-size:13px; font-weight:400; color:var(--mute); margin:48px 0 12px; }
  ul { list-style:none; padding:0; }
  li { display:flex; gap:16px; padding:10px 0; border-top:1px solid var(--line); }
  li:last-child { border-bottom:1px solid var(--line); }
  li .yr { color:var(--mute); width:44px; flex:none; }
  li .what { color:var(--mute); margin-left:auto; text-align:right; }
  .roll { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .roll div { aspect-ratio:4/5; background:var(--line); }
  .roll div:nth-child(2n) { aspect-ratio:4/5; background:linear-gradient(160deg,#c9b8a0,#6d5f50); }
  .roll div:nth-child(3n) { background:linear-gradient(200deg,#9fb3bf,#3e4f5c); }
  footer { margin-top:64px; color:var(--mute); font-size:13px; display:flex; gap:20px; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <h1>lmar</h1>
  <div class="hi">
    <p>Hi! I'm Lmar, a software engineer and photographer.</p>
    <p>This is where I'll put cool things I've built or made.</p>
  </div>

  <h2>// built</h2>
  <ul>
    <li><span class="yr">2026</span><a href="#">project one</a><span class="what">ios app</span></li>
    <li><span class="yr">2025</span><a href="#">project two</a><span class="what">web</span></li>
    <li><span class="yr">2025</span><a href="#">project three</a><span class="what">tool</span></li>
  </ul>

  <h2>// shot</h2>
  <div class="roll"><div></div><div></div><div></div><div></div></div>

  <footer><a href="#">github</a><a href="#">instagram</a><a href="#">email</a></footer>
</main>
</body>
</html>
